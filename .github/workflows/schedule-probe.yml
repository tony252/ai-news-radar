name: Schedule Probe

on:
  schedule:
    # Diagnostic probe: fires every 5 minutes so we can tell whether the
    # scheduler will run scheduled workflows in this fork at all.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo "schedule probe fired at $(date -u +%FT%TZ)"
